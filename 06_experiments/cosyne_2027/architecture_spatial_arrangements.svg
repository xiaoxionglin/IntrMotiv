<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10in" height="6.6in" viewBox="0 0 1600 1056" role="img" aria-labelledby="title description">
  <title id="title">Two spatial arrangements for the CA3 temporal-separation feedback</title>
  <desc id="description">Two wireframes use the panel order of the supplied architecture figure. Arrangement A shows the environment dependency through the existing next-observation loop. Arrangement B adds a dashed environment-to-transition-selection input before temporal separation.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#344657"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#a33336"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 11,6 L 1,11 Z" fill="#2775a9"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1e303f; }
      .heading { font-size: 35px; font-weight: 700; }
      .note { font-size: 27px; fill: #526472; }
      .node { fill: #fff; stroke: #344657; stroke-width: 3; rx: 13; }
      .node-red { stroke: #a33336; }
      .node-blue { stroke: #2775a9; }
      .node-text { font-size: 31px; text-anchor: middle; dominant-baseline: central; }
      .small-text { font-size: 26px; text-anchor: middle; dominant-baseline: central; }
      .edge { fill: none; stroke: #344657; stroke-width: 4; marker-end: url(#arrow-gray); stroke-linejoin: round; }
      .red { fill: none; stroke: #a33336; stroke-width: 4; marker-end: url(#arrow-red); stroke-linejoin: round; }
      .blue { fill: none; stroke: #2775a9; stroke-width: 4; marker-end: url(#arrow-blue); stroke-linejoin: round; }
      .red-label { font-size: 26px; fill: #a33336; }
      .blue-label { font-size: 26px; fill: #2775a9; }
    </style>
  </defs>
  <rect width="1600" height="1056" fill="#fff"/>

  <text class="heading" x="55" y="56">A  ·  Use the existing environment loop</text>
  <text class="note" x="55" y="94">Recommended for the abstract figure</text>
  <path class="edge" d="M 1230,215 V 145 H 160 V 214"/>
  <text class="small-text" x="710" y="129">experienced transition i → j; next observation</text>

  <rect class="node" x="75" y="215" width="170" height="78"/>
  <rect class="node" x="285" y="215" width="190" height="78"/>
  <rect class="node node-red" x="515" y="215" width="140" height="78"/>
  <rect class="node" x="695" y="215" width="140" height="78"/>
  <rect class="node node-blue" x="875" y="215" width="190" height="78"/>
  <rect class="node" x="1105" y="215" width="250" height="78"/>
  <text class="node-text" x="160" y="254">Obs.</text>
  <text class="node-text" x="380" y="254">Encoder</text>
  <text class="node-text" x="585" y="254">DG</text>
  <text class="node-text" x="765" y="254">CA3</text>
  <text class="node-text" x="970" y="254">Worker</text>
  <text class="node-text" x="1230" y="254">Environment</text>
  <path class="edge" d="M 245,254 H 280"/>
  <path class="edge" d="M 475,254 H 510"/>
  <path class="edge" d="M 655,254 H 690"/>
  <path class="edge" d="M 835,254 H 870"/>
  <path class="edge" d="M 1065,254 H 1100"/>
  <path class="edge" d="M 765,293 V 353"/>
  <rect class="node" x="660" y="354" width="210" height="66"/>
  <text class="node-text" x="765" y="387">Δᵢ→ⱼ</text>
  <path class="red" d="M 715,420 V 469 H 585 V 299"/>
  <path class="blue" d="M 815,420 V 469 H 970 V 299"/>
  <text class="red-label" x="328" y="463">DG update</text>
  <text class="blue-label" x="1073" y="463">worker reward</text>
  <text class="note" x="55" y="524">The return loop supplies the sequence; CA3 supplies its temporal separation.</text>

  <line x1="55" x2="1545" y1="552" y2="552" stroke="#d8e0e5" stroke-width="2"/>

  <text class="heading" x="55" y="610">B  ·  Show transition selection explicitly</text>
  <text class="note" x="55" y="648">More literal, but adds a long connection</text>
  <path class="edge" d="M 1230,748 V 678 H 160 V 747"/>
  <text class="small-text" x="709" y="662">next observation</text>

  <rect class="node" x="75" y="748" width="170" height="78"/>
  <rect class="node" x="285" y="748" width="190" height="78"/>
  <rect class="node node-red" x="515" y="748" width="140" height="78"/>
  <rect class="node" x="695" y="748" width="140" height="78"/>
  <rect class="node node-blue" x="875" y="748" width="190" height="78"/>
  <rect class="node" x="1105" y="748" width="250" height="78"/>
  <text class="node-text" x="160" y="787">Obs.</text>
  <text class="node-text" x="380" y="787">Encoder</text>
  <text class="node-text" x="585" y="787">DG</text>
  <text class="node-text" x="765" y="787">CA3</text>
  <text class="node-text" x="970" y="787">Worker</text>
  <text class="node-text" x="1230" y="787">Environment</text>
  <path class="edge" d="M 245,787 H 280"/>
  <path class="edge" d="M 475,787 H 510"/>
  <path class="edge" d="M 655,787 H 690"/>
  <path class="edge" d="M 835,787 H 870"/>
  <path class="edge" d="M 1065,787 H 1100"/>
  <path class="edge" d="M 765,826 V 873"/>
  <rect class="node" x="660" y="873" width="210" height="66"/>
  <text class="node-text" x="765" y="906">Δᵢ→ⱼ</text>
  <rect class="node" x="1065" y="873" width="290" height="66" stroke-dasharray="9 7"/>
  <text class="small-text" x="1210" y="906">sampled i → j</text>
  <path d="M 1230,826 V 869" fill="none" stroke="#344657" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-gray)"/>
  <path d="M 1060,906 H 875" fill="none" stroke="#344657" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-gray)"/>
  <path class="red" d="M 715,939 V 985 H 585 V 832"/>
  <path class="blue" d="M 815,939 V 985 H 970 V 832"/>
  <text class="red-label" x="331" y="980">DG update</text>
  <text class="blue-label" x="1073" y="980">worker reward</text>
  <text class="note" x="55" y="1030">Dashed input chooses the experienced pair; it does not encode spatial distance.</text>
</svg>
